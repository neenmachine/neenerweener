name: macos

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'macos') }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock
      - run: uv sync --directory backend --locked
      - run: uv run --directory backend pytest -q test_sshsig_portable.py
      - run: uv run --locked --directory cli pytest -q
