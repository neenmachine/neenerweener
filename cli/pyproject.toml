[project]
name = "ween-tweet"
version = "0.2.0"
description = "Command line client for the Ween timeline"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0"]

[project.scripts]
tweet = "ween_tweet.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
