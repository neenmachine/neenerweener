[project]
name = "ween-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.158.2",
    "uvicorn[standard]>=0.35.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.5.0",
    "psycopg[binary]>=3.3.8",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "argon2-cffi>=25.1.0",
    "pillow>=11",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
